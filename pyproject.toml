[project]
name = "bitdrop"
version = "0.1.0"
description = "Very fast bulk data transfer between databases using an elastic in-RAM staging tier."
readme = "README.md"
requires-python = ">=3.14"
# The root project is a virtual "meta" project: it only pulls in every workspace member so that
# `uv sync` gives one environment containing all components.
dependencies = [
    "bitdrop-api",
    "bitdrop-core",
    "bitdrop-store-memory",
    "bitdrop-store-file",
    "bitdrop-metadata-memory",
    "bitdrop-metadata-sqlite",
    "bitdrop-connector-memory",
    "bitdrop-connector-postgres",
]

[dependency-groups]
dev = [
    "bitdrop-api[testing]",
    "import-linter>=2.0",
    "mypy>=1.10",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.15.0",
]

# ---------------------------------------------------------------------------------------------
# Workspace: one package per component (see docs/principles.md, P1)
# ---------------------------------------------------------------------------------------------
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bitdrop-api = { workspace = true }
bitdrop-core = { workspace = true }
bitdrop-store-memory = { workspace = true }
bitdrop-store-file = { workspace = true }
bitdrop-metadata-memory = { workspace = true }
bitdrop-metadata-sqlite = { workspace = true }
bitdrop-connector-memory = { workspace = true }
bitdrop-connector-postgres = { workspace = true }

# ---------------------------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
# importlib mode: test files in different packages may share a basename without clashing.
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["docker: needs a running Docker daemon (starts a PostgreSQL container)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ---------------------------------------------------------------------------------------------
# ruff (lint + format)
# ---------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "ASYNC", "C4", "D"]

[tool.ruff.lint.isort]
known-first-party = [
    "bitdrop_api",
    "bitdrop_core",
    "bitdrop_store_memory",
    "bitdrop_store_file",
    "bitdrop_metadata_memory",
    "bitdrop_metadata_sqlite",
    "bitdrop_connector_memory",
    "bitdrop_connector_postgres",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests describe themselves through their names; docstrings are optional there.
"**/tests/**" = ["D", "ASYNC240"]
"tests/**" = ["D", "ASYNC240"]
# End-to-end tests carry SQL fixtures (wide INSERT rows) that are clearer unwrapped.
"tests/e2e/**" = ["D", "ASYNC240", "E501"]
"conftest.py" = ["D"]

# ---------------------------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
mypy_path = [
    "packages/bitdrop-api/src",
    "packages/bitdrop-core/src",
    "packages/bitdrop-store-memory/src",
    "packages/bitdrop-store-file/src",
    "packages/bitdrop-metadata-memory/src",
    "packages/bitdrop-metadata-sqlite/src",
    "packages/bitdrop-connector-memory/src",
    "packages/bitdrop-connector-postgres/src",
]

[[tool.mypy.overrides]]
# ADBC ships neither stubs nor a py.typed marker; only these modules are exempt from checking.
module = ["adbc_driver_postgresql.*", "adbc_driver_manager.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------------------------
# import-linter: the architecture rules of P1 ("every component is exchangeable")
# ---------------------------------------------------------------------------------------------
[tool.importlinter]
root_packages = [
    "bitdrop_api",
    "bitdrop_core",
    "bitdrop_store_memory",
    "bitdrop_store_file",
    "bitdrop_metadata_memory",
    "bitdrop_metadata_sqlite",
    "bitdrop_connector_memory",
    "bitdrop_connector_postgres",
]

[[tool.importlinter.contracts]]
name = "Core and adapters depend on the contracts, never on each other"
type = "layers"
# Names on one line separated by "|" are siblings: independent of each other.
# Everything may import from a layer below it, never from one above or beside it.
layers = [
    "bitdrop_core | bitdrop_store_memory | bitdrop_store_file | bitdrop_metadata_memory | bitdrop_metadata_sqlite | bitdrop_connector_memory | bitdrop_connector_postgres",
    "bitdrop_api",
]
