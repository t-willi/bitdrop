[project]
name = "bitdrop-store-file"
version = "0.1.0"
description = "ChunkStore adapter keeping chunks as files in a directory (point it at a tmpfs for RAM speed)."
requires-python = ">=3.14"
dependencies = ["bitdrop-api"]

[project.entry-points."bitdrop.chunk_stores"]
file = "bitdrop_store_file:create_store"

[tool.uv.sources]
bitdrop-api = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
