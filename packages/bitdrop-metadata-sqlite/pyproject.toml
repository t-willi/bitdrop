[project]
name = "bitdrop-metadata-sqlite"
version = "0.1.0"
description = "MetadataStore adapter persisting chunk states in a SQLite file. Resumable single-host runs."
requires-python = ">=3.14"
dependencies = ["bitdrop-api"]

[project.entry-points."bitdrop.metadata_stores"]
sqlite = "bitdrop_metadata_sqlite:create_store"

[tool.uv.sources]
bitdrop-api = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
