[project]
name = "bitdrop-api"
version = "0.1.0"
description = "Contracts (ports), shared types, and the conformance kit for bitdrop components."
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
# Needed only by the conformance kit in `bitdrop_api.testing`.
testing = ["pytest>=8", "pytest-asyncio>=1.0"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
