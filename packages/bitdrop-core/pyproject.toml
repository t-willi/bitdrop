[project]
name = "bitdrop-core"
version = "0.1.0"
description = "Backend-agnostic core: discovers and opens components by URL."
requires-python = ">=3.14"
dependencies = ["bitdrop-api"]

[tool.uv.sources]
bitdrop-api = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
