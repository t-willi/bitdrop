[project]
name = "bitdrop-queue-memory"
version = "0.1.0"
description = "ChunkQueue adapter keeping messages in this process's memory. For tests and single-process runs."
requires-python = ">=3.14"
dependencies = ["bitdrop-api"]

[project.entry-points."bitdrop.chunk_queues"]
memory = "bitdrop_queue_memory:create_queue"

[tool.uv.sources]
bitdrop-api = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
